name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Import smoke test
        run: python -c "import config, storage, scraper.runner, scheduler, main"

      - name: Validate Docker Compose (syntax)
        env:
          POSTGRES_PASSWORD: ci_dummy_password
        run: |
          docker network inspect npm_network >/dev/null 2>&1 || docker network create npm_network
          docker compose -f docker-compose.yml config > /dev/null
